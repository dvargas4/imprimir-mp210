
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impresora MP210</title>

<style>
:root {
  --naranja: #f47721;
  --naranja-oscuro: #dc5f0f;
  --naranja-claro: #fff4eb;
  --blanco: #ffffff;
  --texto: #302920;
  --borde: #f2dfd0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--blanco);
  color: var(--texto);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
}

main {
  width: min(100% - 32px, 520px);
  margin: 42px auto;
  padding: 28px;
  border: 1px solid var(--borde);
  border-radius: 18px;
  background: var(--blanco);
}

h1 {
  color: var(--naranja);
  text-align: center;
  font-size: 26px;
  margin: 0 0 28px;
  letter-spacing: .06em;
}

h2 {
  font-size: 15px;
  font-weight: 750;
  letter-spacing: .05em;
  margin: 26px 0 12px;
}

button {
  width: 100%;
  padding: 15px 12px;
  border-radius: 11px;
  border: 1px solid var(--naranja);
  background: var(--naranja);
  color: var(--blanco);
  font: inherit;
  font-weight: 750;
  cursor: pointer;
  margin-top: 12px;
}

button:disabled {
  opacity: .48;
  cursor: not-allowed;
}

button:not(:disabled):active {
  background: var(--naranja-oscuro);
}

button.secundario {
  background: var(--blanco);
  color: var(--naranja);
}

select {
  display: block;
  width: 100%;
  padding: 14px 12px;
  border: 1px solid var(--borde);
  border-radius: 11px;
  background: var(--blanco);
  color: var(--texto);
  font: inherit;
  min-height: 51px;
}

#historial {
  padding: 14px;
  border: 1px solid var(--borde);
  border-radius: 11px;
  background: var(--naranja-claro);
  min-height: 80px;
  max-height: 220px;
  overflow-y: auto;
  overflow-wrap: anywhere;
  font-size: 13px;
  white-space: pre-wrap;
}

#historial div + div {
  border-top: 1px solid var(--borde);
  margin-top: 9px;
  padding-top: 9px;
}

@media (max-width: 560px) {
  main {
    width: 100%;
    margin: 0;
    padding: 26px 18px;
    border: 0;
    border-radius: 0;
  }
}
</style>
</head>

<body>
<main>

  <h1>IMPRESORA</h1>

  <button id="conectar">
    CONECTAR IMPRESORA
  </button>

  <h2>TICKETS A IMPRIMIR</h2>

  <select id="tickets" aria-label="Seleccionar ticket">
    <option value="">Consultando tickets...</option>
  </select>

  <button id="imprimir" disabled>
    IMPRIMIR
  </button>

  <button id="detener" class="secundario" disabled>
    DETENER
  </button>

  <h2>HISTORIAL</h2>

  <div id="historial" role="log" aria-live="polite">
    Sin movimientos.
  </div>

</main>

<script>
"use strict";

/* ==========================================
   CONFIGURACIÓN
========================================== */

const URL_PUENTE =
  "https://script.google.com/macros/s/AKfycbxllxZq70BoS5cZb5tlAYZ1N59VZayJ6pBfvrYXlGKIEiSdHIWWE8ue4LpomS3d6OOl8Q/exec";

const TOKEN_PUENTE = "2004";

const SERVICIO =
  "49535343-fe7d-4ae5-8fa9-9fafd205e455";

const CARACT =
  "49535343-8841-43f4-a8d4-ecbe34729bb3";

const COLS = 32;
const INTERVALO_MS = 60000;

const $ = id => document.getElementById(id);

const dormir = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

let dispositivo = null;
let tx = null;
let imprimiendo = false;
let conectando = false;
let cancelado = false;
let consultando = false;
let pendientes = [];
let historial = [];

try {
  const previo = JSON.parse(
    localStorage.getItem("bluefy_historial") || "[]"
  );

  if (Array.isArray(previo)) {
    historial = previo.slice(0, 35);
  }
} catch (_) {}

/* ==========================================
   HISTORIAL
========================================== */

function registrar(mensaje) {

  const hora = new Date().toLocaleString("es-MX", {
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });

  historial.unshift({
    hora,
    mensaje: String(mensaje)
  });

  historial = historial.slice(0, 35);

  try {
    localStorage.setItem(
      "bluefy_historial",
      JSON.stringify(historial)
    );
  } catch (_) {}

  dibujarHistorial();
}

function dibujarHistorial() {

  const contenedor = $("historial");

  contenedor.replaceChildren();

  if (!historial.length) {
    contenedor.textContent = "Sin movimientos.";
    return;
  }

  for (const item of historial) {

    const div = document.createElement("div");

    div.textContent =
      item.hora + " · " + item.mensaje;

    contenedor.appendChild(div);
  }
}

/* ==========================================
   ESTADO DE CONEXIÓN
========================================== */

function conectado() {

  return !!(
    dispositivo &&
    dispositivo.gatt &&
    dispositivo.gatt.connected &&
    tx
  );
}

function botones() {

  $("conectar").disabled =
    conectado() || imprimiendo || conectando;

  $("imprimir").disabled =
    !conectado() ||
    imprimiendo ||
    !$("tickets").value;

  $("detener").disabled = !conectado();

  $("tickets").disabled = imprimiendo;
}

/* ==========================================
   FORMATO DEL TICKET
========================================== */

function normal(s) {

  return String(s ?? "")
    .replace(/ñ/g, "n")
    .replace(/Ñ/g, "N")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[\u2013\u2014]/g, "-")
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[^\x20-\x7e]/g, " ");
}

function pair(a, b, w = COLS) {

  a = normal(a);
  b = normal(b);

  if (a.length + b.length + 1 > w) {
    return a + "\n" + b.padStart(w);
  }

  return a +
    " ".repeat(w - a.length - b.length) +
    b;
}

function wrap(s, w = COLS) {

  const words = normal(s)
    .split(/\s+/)
    .filter(Boolean);

  let lines = [];
  let line = "";

  for (const word0 of words) {

    let word = word0;

    while (word.length > w) {

      if (line) {
        lines.push(line);
        line = "";
      }

      lines.push(word.slice(0, w));
      word = word.slice(w);
    }

    if (!word) continue;

    const next = line
      ? line + " " + word
      : word;

    if (next.length > w) {

      if (line) lines.push(line);

      line = word;

    } else {
      line = next;
    }
  }

  if (line) lines.push(line);

  return lines.length ? lines : [""];
}

function crearTicket(d) {

  let a = [];

  const cmd = (...xs) => a.push(...xs);

  const text = s =>
    a.push(
      ...[...normal(s)].map(c => c.charCodeAt(0))
    );

  const nl = () => cmd(10);

  const ln = s => {
    text(s);
    nl();
  };

  const regla = (n = 1) => {
    for (let i = 0; i < n; i++) {
      ln("=".repeat(COLS));
    }
  };

  const align = n => cmd(27, 97, n);
  const bold = on => cmd(27, 69, on ? 1 : 0);
  const size = n => cmd(29, 33, n);

  const lines = (v, w = COLS) =>
    wrap(v, w).forEach(ln);

  cmd(27, 64);

  align(1);
  bold(true);
  size(17);

  ln("FRUTI VERDURA");
  ln("A DOMICILIO");

  size(0);
  bold(false);

  lines(d.fecha);

  if (d.domicilio_emisor) {
    lines(d.domicilio_emisor);
  }

  const ciudad = [
    d.lugar_emisor,
    d.cp_emisor ? "C.P. " + d.cp_emisor : ""
  ].filter(Boolean).join(" ");

  if (ciudad) lines(ciudad);

  nl();
  align(0);
  regla();

  if (d.tipo === "remision") {

    bold(true);
    ln("DATOS DEL CLIENTE");
    bold(false);

    lines(d.cliente);

    if (d.domicilio_entrega) {
      ln("DOMICILIO DE ENTREGA");
      lines(d.domicilio_entrega);
    }

    bold(true);
    ln("DETALLE");
    bold(false);

    if (d.folio_remision) {
      lines("Folio: " + d.folio_remision);
    }

    if (d.fecha_emision) {
      lines("Expedicion: " + d.fecha_emision);
    }

    if (d.contacto) {
      lines("Contacto: " + d.contacto);
    }

    if (d.telefono) {
      lines("Telefono: " + d.telefono);
    }

  } else {

    bold(true);
    ln("PEDIDO");
    bold(false);

    lines((d.cliente || "").toUpperCase());

    bold(true);
    ln("CONTACTO");
    bold(false);

    lines(
      [d.contacto, d.telefono]
        .filter(Boolean)
        .join(" - ")
    );

    if (d.domicilio_entrega) {

      bold(true);
      ln("DOMICILIO DE ENTREGA");
      bold(false);

      lines(d.domicilio_entrega);
    }
  }

  regla();

  bold(true);
  ln(pair("PRODUCTO", "VENTA"));
  bold(false);

  regla();

  for (const p of (d.productos || [])) {

    const precio = normal(p.venta || "");
    const nombre = normal(p.nombre || "");

    const disponible = Math.max(
      12,
      COLS - precio.length - 1
    );

    const nombreLineas = wrap(
      nombre,
      disponible
    );

    ln(pair(nombreLineas[0], precio));

    nombreLineas.slice(1).forEach(ln);

    ln(normal(p.cantidad));

    if (
      d.tipo === "remision" &&
      p.precio_unitario
    ) {
      lines(
        "Precio unitario: " +
        p.precio_unitario
      );
    }

    ln("-".repeat(COLS));
  }

  regla();

  ln(pair("Productos", d.total_productos));
  ln(pair("Subtotal", d.subtotal));

  if (d.envio) {
    ln(pair("Envio", d.envio));
  }

  if (d.descuento) {
    ln(pair("Descuento", d.descuento));
  }

  regla();

  bold(true);
  size(0);

  ln(pair("TOTAL", d.total));

  bold(false);

  regla();

  if (d.tipo === "remision") {

    bold(true);
    ln("PAGO");
    bold(false);

    if (d.estado_pago) {
      lines("Estado: " + d.estado_pago);
    }

    if (d.medio_pago) {
      lines("Medio: " + d.medio_pago);
    }

    if (d.cfdi_referencia) {
      lines("CFDI: " + d.cfdi_referencia);
    }

    regla();

    bold(true);
    ln("RECEPCION DE MERCANCIA");
    bold(false);

    if (d.observaciones_remision) {
      lines(
        "Observaciones: " +
        d.observaciones_remision
      );
    }

    ln("Recibio: ____________________");
    ln("Firma: _____________________");
    ln("Fecha y hora: _____________");

    regla();

    align(1);

    lines("Este documento no es un CFDI.");
    lines("La recepcion no acredita el pago.");

  } else {

    align(1);

    bold(true);
    ln("GRACIAS POR TU COMPRA");
    bold(false);

    lines(
      "Solo informativo. No es comprobante fiscal."
    );
  }

  size(0);
  align(0);

  nl();
  nl();

  return new Uint8Array(a);
}

/* ==========================================
   ENVÍO BLUETOOTH
========================================== */

async function enviar(bytes) {

  for (let i = 0; i < bytes.length; i += 20) {

    if (cancelado) {
      throw Error(
        "Impresion detenida. El ticket puede haber salido incompleto."
      );
    }

    if (!conectado()) {
      throw Error("Impresora desconectada.");
    }

    const parte = bytes.slice(i, i + 20);

    if (tx.properties.write) {
      await tx.writeValueWithResponse(parte);
    } else {
      await tx.writeValueWithoutResponse(parte);
    }

    await dormir(100);
  }
}

/* ==========================================
   PUENTE APPS SCRIPT
========================================== */

function llamarPuente(accion, params = {}) {

  return new Promise((resolve, reject) => {

    if (!/^\d{4}$/.test(TOKEN_PUENTE)) {

      reject(
        Error("PIN inválido en el código.")
      );

      return;
    }

    const cb =
      "bluefy_cb_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    let terminado = false;

    const limpiar = () => {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    };

    const timer = setTimeout(() => {

      if (terminado) return;

      terminado = true;
      limpiar();

      reject(
        Error("Tiempo de consulta agotado.")
      );

    }, 18000);

    window[cb] = r => {

      if (terminado) return;

      terminado = true;
      limpiar();

      if (!r || !r.ok) {

        reject(
          Error(r?.error || "Error del puente.")
        );

      } else {
        resolve(r);
      }
    };

    script.onerror = () => {

      if (terminado) return;

      terminado = true;
      limpiar();

      reject(
        Error("No se pudo contactar al puente.")
      );
    };

    script.src =
      URL_PUENTE +
      "?" +
      new URLSearchParams({
        accion,
        token: TOKEN_PUENTE,
        callback: cb,
        ...params
      });

    document.head.appendChild(script);
  });
}

/* ==========================================
   LISTA DE TICKETS
========================================== */

async function cargarTickets() {

  if (consultando || imprimiendo) return;

  consultando = true;

  try {

    const respuesta =
      await llamarPuente("listar");

    pendientes = Array.isArray(respuesta.tickets)
      ? respuesta.tickets
      : [];

    const anterior = $("tickets").value;
    const selector = $("tickets");

    selector.replaceChildren();

    const vacio = document.createElement("option");

    vacio.value = "";

    vacio.textContent = pendientes.length
      ? "Selecciona un ticket"
      : "No hay tickets pendientes";

    selector.appendChild(vacio);

    for (const job of pendientes) {

      const opt = document.createElement("option");

      opt.value = job.id;

      opt.textContent = [
        job.cliente || "Sin cliente",
        job.fecha || "",
        job.total || ""
      ].filter(Boolean).join(" · ");

      selector.appendChild(opt);
    }

    if (pendientes.some(j => j.id === anterior)) {
      selector.value = anterior;
    }

  } catch (err) {

    registrar(
      "No se pudo consultar la cola: " +
      err.message
    );

  } finally {

    consultando = false;
    botones();
  }
}

/* ==========================================
   CONECTAR IMPRESORA
========================================== */

async function conectar() {

  if (!navigator.bluetooth) {
    throw Error(
      "Usa Chrome compatible o Bluefy en iPhone."
    );
  }

  dispositivo =
    await navigator.bluetooth.requestDevice({
      filters: [
        {
          namePrefix: "MP210"
        }
      ],
      optionalServices: [SERVICIO]
    });

  dispositivo.addEventListener(
    "gattserverdisconnected",
    () => {

      tx = null;
      cancelado = true;

      registrar("Impresora desconectada.");

      botones();
    }
  );

  const server = await dispositivo.gatt.connect();

  const servicio =
    await server.getPrimaryService(SERVICIO);

  tx = await servicio.getCharacteristic(CARACT);

  if (
    !tx.properties.write &&
    !tx.properties.writeWithoutResponse
  ) {
    throw Error(
      "La impresora no admite escritura."
    );
  }

  cancelado = false;

  registrar("Impresora conectada.");

  botones();
}

$("conectar").onclick = async () => {

  if (conectando || conectado()) return;

  conectando = true;

  botones();

  try {

    await conectar();

  } catch (err) {

    registrar(
      "Error de conexión: " +
      err.message
    );

  } finally {

    conectando = false;

    botones();
  }
};

/* ==========================================
   SELECCIONAR E IMPRIMIR
========================================== */

$("tickets").onchange = botones;

$("imprimir").onclick = async () => {

  if (imprimiendo || !conectado()) return;

  const id = $("tickets").value;

  if (!id) return;

  imprimiendo = true;
  cancelado = false;

  botones();

  let tomado = false;

  try {

    const r = await llamarPuente(
      "tomar",
      {id}
    );

    if (!r.trabajo) {
      throw Error("Ticket no disponible.");
    }

    tomado = true;

    registrar(
      "Imprimiendo ticket de " +
      (r.trabajo.datos.cliente || "cliente") +
      "."
    );

    await enviar(
      crearTicket(r.trabajo.datos)
    );

    await llamarPuente(
      "confirmar",
      {id}
    );

    registrar(
      "Ticket impreso y confirmado."
    );

  } catch (err) {

    registrar(
      "Error al imprimir: " +
      err.message
    );

    if (tomado) {

      try {

        await llamarPuente(
          "error",
          {
            id,
            mensaje: String(err.message || err)
          }
        );

      } catch (_) {

        registrar(
          "No se pudo confirmar el estado. " +
          "Revisa el papel antes de reintentar."
        );
      }
    }

  } finally {

    imprimiendo = false;

    botones();

    await cargarTickets();
  }
};

/* ==========================================
   DETENER
========================================== */

$("detener").onclick = () => {

  cancelado = true;

  if (dispositivo?.gatt?.connected) {
    dispositivo.gatt.disconnect();
  }

  tx = null;

  botones();
};

/* ==========================================
   ACTUALIZAR LISTA CADA 60 SEGUNDOS
   SIN IMPRIMIR AUTOMÁTICAMENTE
========================================== */

setInterval(
  cargarTickets,
  INTERVALO_MS
);

dibujarHistorial();
botones();
cargarTickets();

</script>
</body>
</html>
