<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba de impresión MP210</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1f1e;--mut:#5f6663;--line:#d4d8d5;--ac:#1f5f4a;--acfg:#fff;--err:#a3261c}
@media (prefers-color-scheme:dark){:root{--bg:#161817;--fg:#ecefed;--mut:#9aa39f;--line:#333937;--ac:#5fc4a0;--acfg:#0d1a15;--err:#ff8a7e}}
*{box-sizing:border-box}
body{margin:0;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;max-width:560px;margin-inline:auto}
h1{font-size:1.35rem;margin:.5rem 0 .25rem}
p{margin:.25rem 0 1rem;color:var(--mut)}
button{font:inherit;width:100%;padding:14px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--acfg);margin:.4rem 0;cursor:pointer}
button.sec{background:transparent;color:var(--ac)}
button:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.preview{width:100%;max-width:384px;border:1px solid var(--line);background:#fff;display:block;margin:1rem auto;image-rendering:pixelated}
#estado{min-height:3em;white-space:pre-wrap;font-size:.95rem}
#estado.error{color:var(--err)}
details{margin-top:1rem;color:var(--mut)}
label{display:block;margin:.5rem 0}
input{font:inherit;width:6em;padding:6px}
</style>
</head>
<body>
<h1>Prueba de impresión MP210</h1>
<p>Imprime una guía de ancho del 1 al 10 directamente por Bluetooth, sin Print Fast. Ábrela en Bluefy.</p>

<canvas id="vista" class="preview" width="384" height="10"></canvas>
<p id="conexion">Impresora: desconectada</p>
<button id="conectar" type="button">Conectar impresora (no imprime nada)</button>
<button id="test" class="sec" type="button">Enviar solo la palabra TEST</button>
<button id="corta" class="sec" type="button">Prueba corta (menos de 1 cm)</button>
<button id="imprimir" class="sec" type="button">Prueba completa (unos 4 cm)</button>
<button id="detener" class="sec" type="button" disabled>Detener envío</button>
<button id="desconectar" class="sec" type="button" disabled>Desconectar</button>
<div id="estado" role="status" aria-live="polite"></div>

<details>
<summary>Ajustes de envío</summary>
<label>Modo de escritura
<select id="modo"><option value="conf" selected>Con confirmación (más seguro)</option><option value="sin">Sin confirmación (más rápido)</option></select></label>
<label>Bytes por bloque <input id="tam" type="number" value="100" min="20" max="180"></label>
<label>Pausa entre bloques (ms) <input id="pausa" type="number" value="30" min="0" max="200"></label>
<p>Versión 5</p>
<label>Filas por franja <input id="franja" type="number" value="64" min="8" max="255"></label>
</details>

<script>
"use strict";
const SERVICIO = "49535343-fe7d-4ae5-8fa9-9fafd205e455";
const CARACT = "49535343-8841-43f4-a8d4-ecbe34729bb3";
const ANCHO = 384;
const $ = id => document.getElementById(id);
let dispositivo = null, caract = null;

function decir(texto, error){
  const e = $("estado");
  e.textContent = texto;
  e.className = error ? "error" : "";
}

// Dibuja la prueba: borde, regla 1-10 al ancho completo, texto y bloque negro.
function dibujarPrueba(){
  const c = $("vista"), g = c.getContext("2d");
  const alto = 330;
  c.height = alto;
  g.fillStyle = "#fff"; g.fillRect(0, 0, ANCHO, alto);
  g.fillStyle = "#000"; g.strokeStyle = "#000";
  g.lineWidth = 2; g.strokeRect(1, 1, ANCHO - 2, alto - 2);
  g.font = "bold 26px sans-serif"; g.textAlign = "center";
  g.fillText("PRUEBA 384 px", ANCHO / 2, 40);
  g.font = "22px sans-serif";
  g.fillText("Si el 10 sale completo,", ANCHO / 2, 72);
  g.fillText("la escala es 1:1", ANCHO / 2, 98);
  const y = 150;
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(2, y); g.lineTo(ANCHO - 2, y); g.stroke();
  g.font = "bold 20px sans-serif";
  for (let n = 1; n <= 10; n++){
    const x = 2 + (n - 1) * (ANCHO - 4) / 9;
    g.beginPath(); g.moveTo(x, y - 14); g.lineTo(x, y + 14); g.stroke();
    const w = g.measureText(String(n)).width;
    const xt = Math.max(2, Math.min(ANCHO - 2 - w, x - w / 2));
    g.textAlign = "left";
    g.fillText(String(n), xt, y + 40);
  }
  g.textAlign = "center";
  g.font = "25px sans-serif";
  g.fillText("Texto de 25 px: Cebolla 1.500 kg", ANCHO / 2, 235);
  g.fillRect(20, 255, ANCHO - 40, 50);
  return c;
}

// Prueba corta: solo la regla 1-10, 70 filas (unos 9 mm).
function dibujarCorta(){
  const c = $("vista"), g = c.getContext("2d");
  c.height = 70;
  g.fillStyle = "#fff"; g.fillRect(0, 0, ANCHO, 70);
  g.fillStyle = "#000"; g.strokeStyle = "#000"; g.lineWidth = 3;
  const y = 18;
  g.beginPath(); g.moveTo(2, y); g.lineTo(ANCHO - 2, y); g.stroke();
  g.font = "bold 20px sans-serif"; g.textAlign = "left";
  for (let n = 1; n <= 10; n++){
    const x = 2 + (n - 1) * (ANCHO - 4) / 9;
    g.beginPath(); g.moveTo(x, y - 14); g.lineTo(x, y + 14); g.stroke();
    const w = g.measureText(String(n)).width;
    g.fillText(String(n), Math.max(2, Math.min(ANCHO - 2 - w, x - w / 2)), y + 40);
  }
  return c;
}

// Convierte el lienzo a bytes de 1 bit por pixel, 48 bytes por fila (negro = 1).
function aRaster(c){
  const g = c.getContext("2d");
  const datos = g.getImageData(0, 0, ANCHO, c.height).data;
  const bpf = ANCHO / 8, filas = c.height, out = new Uint8Array(bpf * filas);
  for (let y = 0; y < filas; y++)
    for (let x = 0; x < ANCHO; x++){
      const i = (y * ANCHO + x) * 4;
      const luz = 0.299 * datos[i] + 0.587 * datos[i + 1] + 0.114 * datos[i + 2];
      if (luz < 160) out[y * bpf + (x >> 3)] |= 0x80 >> (x & 7);
    }
  return {bytes: out, bpf, filas};
}

// Une comandos ESC/POS: iniciar, franjas GS v 0, avance de papel.
function armarComandos(r, filasFranja){
  const partes = [new Uint8Array([0x1B, 0x40])];
  for (let y = 0; y < r.filas; y += filasFranja){
    const n = Math.min(filasFranja, r.filas - y);
    partes.push(new Uint8Array([0x1D, 0x76, 0x30, 0x00, r.bpf & 255, r.bpf >> 8, n & 255, n >> 8]));
    partes.push(r.bytes.subarray(y * r.bpf, (y + n) * r.bpf));
  }
  partes.push(new Uint8Array([0x0A, 0x0A, 0x0A]));
  const total = partes.reduce((s, p) => s + p.length, 0);
  const todo = new Uint8Array(total);
  let pos = 0;
  for (const p of partes){ todo.set(p, pos); pos += p.length; }
  return todo;
}

const dormir = ms => new Promise(r => setTimeout(r, ms));

async function conectar(){
  if (!navigator.bluetooth)
    throw new Error("Este navegador no tiene Web Bluetooth. Abre esta página en Bluefy.");
  if (dispositivo && dispositivo.gatt.connected && caract) return;
  if (!dispositivo){
    dispositivo = await navigator.bluetooth.requestDevice({
      filters: [{namePrefix: "MP210"}],
      optionalServices: [SERVICIO]
    });
    dispositivo.addEventListener("gattserverdisconnected", () => {
      caract = null; $("desconectar").disabled = true;
      $("conexion").textContent = "Impresora: desconectada";
      decir("La impresora se desconectó.");
    });
  }
  const servidor = await dispositivo.gatt.connect();
  const servicio = await servidor.getPrimaryService(SERVICIO);
  caract = await servicio.getCharacteristic(CARACT);
  $("desconectar").disabled = false;
  $("conexion").textContent = "Impresora: conectada";
}

let imprimiendo = false, detenido = false, clics = 0, escrituras = 0;

async function enviar(bytes){
  const tam = Math.max(20, Math.min(180, +$("tam").value || 100));
  const pausa = Math.max(0, +$("pausa").value || 0);
  const confirmado = $("modo").value === "conf" || !caract.writeValueWithoutResponse;
  escrituras = 0;
  for (let i = 0; i < bytes.length; i += tam){
    if (detenido) throw new Error("Envío detenido. Se mandaron " + escrituras + " bloques.");
    const bloque = bytes.subarray(i, i + tam);
    if (confirmado) await caract.writeValueWithResponse(bloque);
    else await caract.writeValueWithoutResponse(bloque);
    escrituras++;
    if (pausa) await dormir(pausa);
    if (escrituras % 10 === 0)
      decir("Enviando… " + Math.round(100 * i / bytes.length) + " %\nBloques: " + escrituras +
            " de " + Math.ceil(bytes.length / tam) + " · clics: " + clics);
  }
}

async function lanzar(dibujar){
  clics++;
  if (imprimiendo){ decir("Ya hay un envío en curso. Clics: " + clics, true); return; }
  imprimiendo = true; detenido = false;
  $("imprimir").disabled = true; $("corta").disabled = true; $("detener").disabled = false;
  try{
    if (!dispositivo || !dispositivo.gatt.connected || !caract)
      throw new Error("Primero pulsa Conectar impresora.");
    const r = aRaster(dibujar());
    const franja = Math.max(8, Math.min(255, +$("franja").value || 64));
    const comandos = armarComandos(r, franja);
    await enviar(comandos);
    decir("Listo. Bytes enviados: " + comandos.length + " en " + escrituras +
          " bloques. Clics: " + clics + ".\nRevisa que el 10 salga completo, sin cortarse.");
  } catch (e){
    decir("No se pudo imprimir: " + (e && e.message ? e.message : e), true);
  } finally {
    imprimiendo = false;
    $("imprimir").disabled = false; $("corta").disabled = false; $("detener").disabled = true;
  }
}
$("imprimir").addEventListener("click", () => lanzar(dibujarPrueba));
$("corta").addEventListener("click", () => lanzar(dibujarCorta));

$("conectar").addEventListener("click", async () => {
  try{
    decir("Conectando…");
    await conectar();
    decir("Conectado. No se envió ningún dato. Espera 15 segundos y observa si sale papel.");
  } catch (e){
    decir("No se pudo conectar: " + (e && e.message ? e.message : e), true);
  }
});

$("test").addEventListener("click", async () => {
  if (imprimiendo) return;
  imprimiendo = true;
  try{
    if (!dispositivo || !dispositivo.gatt.connected || !caract)
      throw new Error("Primero pulsa Conectar impresora.");
    await caract.writeValueWithResponse(new Uint8Array([0x1B, 0x40, 0x54, 0x45, 0x53, 0x54, 0x0A, 0x0A, 0x0A]));
    decir("Se envió TEST (9 bytes) una sola vez.");
  } catch (e){
    decir("No se pudo enviar: " + (e && e.message ? e.message : e), true);
  } finally {
    imprimiendo = false;
  }
});

$("detener").addEventListener("click", () => {
  detenido = true;
  decir("Deteniendo…");
});

$("desconectar").addEventListener("click", () => {
  if (dispositivo && dispositivo.gatt.connected) dispositivo.gatt.disconnect();
});

dibujarPrueba();
</script>
</body>
</html>
