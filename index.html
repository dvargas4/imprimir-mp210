
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluefy | MP210</title>

<style>
:root {
  --bg: #f7f8f6;
  --fg: #202824;
  --green: #246a50;
  --line: #d7dfd9;
}

* {
  box-sizing: border-box;
}

body {
  font: 16px/1.5 -apple-system, system-ui, sans-serif;
  margin: 0 auto;
  padding: 24px 16px;
  max-width: 540px;
  background: var(--bg);
  color: var(--fg);
}

.card {
  padding: 18px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  margin: 14px 0;
}

h1 {
  font-size: 25px;
}

p {
  color: #57665e;
}

button {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 0;
  border-radius: 9px;
  background: var(--green);
  color: white;
  font-size: 16px;
  font-weight: 600;
}

button:disabled {
  opacity: .4;
}

button.sec {
  background: white;
  color: var(--green);
  border: 1px solid var(--green);
}

#estado {
  white-space: pre-wrap;
  font: 14px/1.6 system-ui;
  min-height: 4em;
}
</style>
</head>

<body>

<h1>Impresión MP210</h1>

<p>
  Recibe los tickets seleccionados desde
  Fruti Verdura a Domicilio.
</p>

<div class="card">

  <b>Impresora</b>

  <p id="conexion">Desconectada</p>

  <button id="conectar">
    Conectar MP210
  </button>

  <button id="test" class="sec" disabled>
    Imprimir TEST
  </button>

  <button id="buscar" class="sec" disabled>
    Revisar tickets pendientes
  </button>

  <button id="detener" class="sec" disabled>
    Detener y desconectar
  </button>

</div>

<div class="card">

  <b>Recepción de tickets</b>

  <p>
    Los tickets se consultan cada 60 segundos
    mientras la impresora esté conectada.
  </p>

  <div id="estado">
    Pulsa Conectar MP210 para comenzar.
  </div>

</div>

<script>
"use strict";

/* ============================================
   CONFIGURACIÓN DEL PUENTE BLUEFY

   URL ACTUAL DE GOOGLE APPS SCRIPT
   PIN DE CUATRO DÍGITOS
============================================ */

const URL_PUENTE =
  "https://script.google.com/macros/s/AKfycbxllxZq70BoS5cZb5tlAYZ1N59VZayJ6pBfvrYXlGKIEiSdHIWWE8ue4LpomS3d6OOl8Q/exec";

const TOKEN_PUENTE = "2004";

/* ============================================
   CONFIGURACIÓN BLUETOOTH MP210
============================================ */

const SERVICIO =
  "49535343-fe7d-4ae5-8fa9-9fafd205e455";

const CARACT =
  "49535343-8841-43f4-a8d4-ecbe34729bb3";

const INTERVALO_MS = 60000;
const COLS = 32;

const $ = id => document.getElementById(id);

let dispositivo = null;
let tx = null;
let busy = false;
let canceled = false;
let consultando = false;

let ultimoError = "";
let ultimoId = "";

/* ============================================
   ESTADO DE LA INTERFAZ
============================================ */

function estado(mensaje) {
  $("estado").textContent = mensaje;
}

function conectado() {
  return !!(
    dispositivo &&
    dispositivo.gatt &&
    dispositivo.gatt.connected &&
    tx
  );
}

function botones() {
  const c = conectado();

  $("conectar").disabled = c || busy;
  $("test").disabled = !c || busy;
  $("buscar").disabled = !c || busy || consultando;
  $("detener").disabled = !c;

  $("conexion").textContent =
    c ? "Conectada" : "Desconectada";
}

const dormir = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

/* ============================================
   CONEXIÓN BLUETOOTH
============================================ */

async function conectar() {

  if (!navigator.bluetooth) {
    throw Error(
      "Abre esta página HTTPS desde Bluefy o Chrome compatible."
    );
  }

  dispositivo = await navigator.bluetooth.requestDevice({
    filters: [
      {
        namePrefix: "MP210"
      }
    ],
    optionalServices: [SERVICIO]
  });

  dispositivo.addEventListener(
    "gattserverdisconnected",
    () => {
      tx = null;
      canceled = true;

      estado(
        "Impresora desconectada. " +
        "Vuelve a conectarla para recibir tickets."
      );

      botones();
    }
  );

  const server = await dispositivo.gatt.connect();

  const service =
    await server.getPrimaryService(SERVICIO);

  tx = await service.getCharacteristic(CARACT);

  if (
    !tx.properties.write &&
    !tx.properties.writeWithoutResponse
  ) {
    throw Error(
      "La característica Bluetooth no admite escritura."
    );
  }

  canceled = false;

  botones();

  estado(
    "Bluetooth conectado. Revisando tickets pendientes..."
  );

  await revisar();
}

/* ============================================
   ENVÍO DE BYTES A LA IMPRESORA
============================================ */

async function enviar(bytes) {

  for (let i = 0; i < bytes.length; i += 20) {

    if (canceled) {
      throw Error(
        "Envío cancelado. El ticket podría estar incompleto."
      );
    }

    if (!conectado()) {
      throw Error("Bluetooth desconectado.");
    }

    const part = bytes.slice(i, i + 20);

    if (tx.properties.write) {
      await tx.writeValueWithResponse(part);
    } else {
      await tx.writeValueWithoutResponse(part);
    }

    await dormir(100);
  }
}

/* ============================================
   FORMATO DE TEXTO
============================================ */

function normal(s) {

  return String(s ?? "")
    .replace(/ñ/g, "n")
    .replace(/Ñ/g, "N")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[\u2013\u2014]/g, "-")
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[^\x20-\x7e]/g, " ");
}

function centro(s, w = COLS) {

  s = normal(s);

  return s.length >= w
    ? s
    : s
        .padStart(Math.floor((w + s.length) / 2))
        .padEnd(w);
}

function pair(a, b, w = COLS) {

  a = normal(a);
  b = normal(b);

  if (a.length + b.length + 1 > w) {
    return a + "\n" + b.padStart(w);
  }

  return a +
    " ".repeat(w - a.length - b.length) +
    b;
}

function wrap(s, w = COLS) {

  const words = normal(s)
    .split(/\s+/)
    .filter(Boolean);

  let lines = [];
  let line = "";

  for (const word0 of words) {

    let word = word0;

    while (word.length > w) {

      if (line) {
        lines.push(line);
        line = "";
      }

      lines.push(word.slice(0, w));

      word = word.slice(w);
    }

    if (!word) continue;

    const next = line
      ? line + " " + word
      : word;

    if (next.length > w) {

      if (line) {
        lines.push(line);
      }

      line = word;

    } else {

      line = next;
    }
  }

  if (line) {
    lines.push(line);
  }

  return lines.length
    ? lines
    : [""];
}

/* ============================================
   CREACIÓN DEL TICKET ESC/POS
============================================ */

function crearTicket(d) {

  let a = [];

  const cmd = (...xs) => a.push(...xs);

  const text = s =>
    a.push(
      ...[...normal(s)].map(c => c.charCodeAt(0))
    );

  const nl = () => cmd(10);

  const ln = s => {
    text(s);
    nl();
  };

  const regla = (n = 1) => {
    for (let i = 0; i < n; i++) {
      ln("=".repeat(COLS));
    }
  };

  const align = n => cmd(27, 97, n);
  const bold = on => cmd(27, 69, on ? 1 : 0);
  const size = n => cmd(29, 33, n);

  const lines = (v, w = COLS) =>
    wrap(v, w).forEach(ln);

  // Inicializar impresora
  cmd(27, 64);

  // Encabezado
  align(1);
  bold(true);
  size(17);

  ln("FRUTI VERDURA");
  ln("A DOMICILIO");

  size(0);
  bold(false);

  lines(d.fecha);

  if (d.domicilio_emisor) {
    lines(d.domicilio_emisor);
  }

  const ciudad = [
    d.lugar_emisor,
    d.cp_emisor
      ? "C.P. " + d.cp_emisor
      : ""
  ].filter(Boolean).join(" ");

  if (ciudad) {
    lines(ciudad);
  }

  nl();
  align(0);
  regla();

  /* DATOS DEL CLIENTE */

  if (d.tipo === "remision") {

    bold(true);
    ln("DATOS DEL CLIENTE");
    bold(false);

    lines(d.cliente);

    if (d.domicilio_entrega) {
      ln("DOMICILIO DE ENTREGA");
      lines(d.domicilio_entrega);
    }

    bold(true);
    ln("DETALLE");
    bold(false);

    if (d.folio_remision) {
      lines("Folio: " + d.folio_remision);
    }

    if (d.fecha_emision) {
      lines("Expedicion: " + d.fecha_emision);
    }

    if (d.contacto) {
      lines("Contacto: " + d.contacto);
    }

    if (d.telefono) {
      lines("Telefono: " + d.telefono);
    }

  } else {

    bold(true);
    ln("PEDIDO");
    bold(false);

    lines((d.cliente || "").toUpperCase());

    bold(true);
    ln("CONTACTO");
    bold(false);

    lines(
      [d.contacto, d.telefono]
        .filter(Boolean)
        .join(" - ")
    );

    if (d.domicilio_entrega) {

      bold(true);
      ln("DOMICILIO DE ENTREGA");
      bold(false);

      lines(d.domicilio_entrega);
    }
  }

  /* PRODUCTOS */

  regla();

  bold(true);
  ln(pair("PRODUCTO", "VENTA"));
  bold(false);

  regla();

  for (const p of (d.productos || [])) {

    const precio = normal(p.venta || "");
    const nombre = normal(p.nombre || "");

    const disponible = Math.max(
      12,
      COLS - precio.length - 1
    );

    const nombreLineas = wrap(
      nombre,
      disponible
    );

    ln(
      pair(nombreLineas[0], precio)
    );

    nombreLineas.slice(1).forEach(ln);

    ln(normal(p.cantidad));

    if (
      d.tipo === "remision" &&
      p.precio_unitario
    ) {
      lines(
        "Precio unitario: " +
        p.precio_unitario
      );
    }

    ln("-".repeat(COLS));
  }

  /* TOTALES */

  regla();

  ln(
    pair(
      "Productos",
      d.total_productos
    )
  );

  ln(
    pair(
      "Subtotal",
      d.subtotal
    )
  );

  if (d.envio) {
    ln(pair("Envio", d.envio));
  }

  if (d.descuento) {
    ln(pair("Descuento", d.descuento));
  }

  regla();

  bold(true);
  size(0);

  ln(pair("TOTAL", d.total));

  bold(false);

  regla();

  /* REMISIÓN O TICKET */

  if (d.tipo === "remision") {

    bold(true);
    ln("PAGO");
    bold(false);

    if (d.estado_pago) {
      lines("Estado: " + d.estado_pago);
    }

    if (d.medio_pago) {
      lines("Medio: " + d.medio_pago);
    }

    if (d.cfdi_referencia) {
      lines("CFDI: " + d.cfdi_referencia);
    }

    regla();

    bold(true);
    ln("RECEPCION DE MERCANCIA");
    bold(false);

    if (d.observaciones_remision) {
      lines(
        "Observaciones: " +
        d.observaciones_remision
      );
    }

    ln("Recibio: ____________________");
    ln("Firma: _____________________");
    ln("Fecha y hora: _____________");

    regla();

    align(1);

    lines("Este documento no es un CFDI.");
    lines("La recepcion no acredita el pago.");

  } else {

    align(1);

    bold(true);
    ln("GRACIAS POR TU COMPRA");
    bold(false);

    lines(
      "Solo informativo. No es comprobante fiscal."
    );
  }

  size(0);
  align(0);

  nl();
  nl();

  return new Uint8Array(a);
}

/* ============================================
   COMUNICACIÓN CON GOOGLE APPS SCRIPT
============================================ */

function llamarPuente(accion, params = {}) {

  return new Promise((resolve, reject) => {

    if (
      !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(
        URL_PUENTE
      )
    ) {
      reject(
        Error("URL de Apps Script inválida.")
      );
      return;
    }

    if (!/^\d{4}$/.test(TOKEN_PUENTE)) {

      reject(
        Error(
          "El PIN debe contener exactamente 4 números."
        )
      );

      return;
    }

    const cb =
      "bluefy_cb_" +
      Math.random().toString(36).slice(2);

    let script = document.createElement("script");
    let done = false;

    const limpiar = () => {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    };

    const timer = setTimeout(() => {

      if (!done) {

        done = true;
        limpiar();

        reject(
          Error("Tiempo de consulta agotado.")
        );
      }

    }, 18000);

    window[cb] = respuesta => {

      if (done) return;

      done = true;
      limpiar();

      if (!respuesta?.ok) {

        reject(
          Error(
            respuesta?.error ||
            "Falló la consulta del puente."
          )
        );

      } else {

        resolve(respuesta);
      }
    };

    const qs = new URLSearchParams({
      accion,
      token: TOKEN_PUENTE,
      callback: cb,
      ...params
    });

    script.src =
      URL_PUENTE + "?" + qs.toString();

    script.onerror = () => {

      if (!done) {

        done = true;
        limpiar();

        reject(
          Error(
            "No se pudo cargar la respuesta de Apps Script."
          )
        );
      }
    };

    document.head.appendChild(script);
  });
}

/* ============================================
   CONSULTA DE TICKETS PENDIENTES
============================================ */

async function revisar() {

  if (
    !conectado() ||
    consultando ||
    busy
  ) {
    return;
  }

  consultando = true;
  botones();

  let procesados = 0;

  try {

    while (
      conectado() &&
      procesados < 10
    ) {

      const r = await llamarPuente("tomar");

      if (!r.trabajo) {

        estado(
          procesados
            ? "Se enviaron " +
              procesados +
              " ticket(s).\nNo quedan pendientes."
            : "Conectada.\nNo hay tickets pendientes."
        );

        break;
      }

      const job = r.trabajo;

      ultimoId = job.id;

      busy = true;
      botones();

      try {

        const bytes = crearTicket(
          job.datos
        );

        estado(
          "Imprimiendo " +
          (job.datos.cliente || "ticket") +
          "\n" +
          bytes.length +
          " bytes..."
        );

        canceled = false;

        await enviar(bytes);

        await llamarPuente(
          "confirmar",
          {
            id: job.id
          }
        );

        procesados++;

        estado(
          "Ticket " +
          job.id.slice(0, 8) +
          " enviado y confirmado."
        );

        await dormir(600);

      } catch (err) {

        ultimoError = String(
          err.message || err
        );

        estado(
          "ERROR: " +
          ultimoError +
          "\nNo se reimprimirá automáticamente."
        );

        try {

          await llamarPuente(
            "error",
            {
              id: job.id,
              mensaje: ultimoError
            }
          );

        } catch (_) {}

        break;

      } finally {

        busy = false;
        botones();
      }
    }

    if (procesados === 10) {

      estado(
        "Se enviaron 10 tickets. " +
        "Los demás se revisarán en el siguiente ciclo."
      );
    }

  } catch (err) {

    estado(
      "No se pudo consultar la cola:\n" +
      (err.message || err)
    );

  } finally {

    consultando = false;
    botones();
  }
}

/* ============================================
   BOTONES
============================================ */

$("conectar").onclick = async () => {

  if (busy) return;

  busy = true;
  botones();

  try {

    await conectar();

  } catch (e) {

    estado(
      "Error: " + e.message
    );

  } finally {

    busy = false;
    botones();
  }

  // Revisar después de finalizar la conexión
  await revisar();
};

$("test").onclick = async () => {

  if (busy) return;

  busy = true;
  canceled = false;

  botones();

  try {

    await enviar(
      new Uint8Array([
        27, 64,
        84, 69, 83, 84,
        10, 10, 10
      ])
    );

    estado(
      "TEST enviado correctamente."
    );

  } catch (e) {

    estado(
      "ERROR TEST: " + e.message
    );

  } finally {

    busy = false;
    botones();
  }
};

$("buscar").onclick = () => {
  revisar();
};

$("detener").onclick = () => {

  canceled = true;

  if (
    dispositivo?.gatt?.connected
  ) {
    dispositivo.gatt.disconnect();
  }

  tx = null;

  estado(
    "Desconectada."
  );

  botones();
};

/* ============================================
   CONSULTA AUTOMÁTICA CADA 60 SEGUNDOS

   SOLO CONSULTA TICKETS ENVIADOS
   MANUALMENTE DESDE STREAMLIT.
============================================ */

setInterval(() => {

  if (conectado()) {
    revisar();
  }

}, INTERVALO_MS);

/* ============================================
   INICIALIZACIÓN
============================================ */

estado(
  "Puente configurado.\n" +
  "Conecta la MP210 para recibir tickets."
);

botones();

</script>

</body>
</html>
